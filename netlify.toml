[build]
  # Monorepo: build runs from the repo root (npm workspaces)
  command = "npm run build"

  # Directory that contains the deploy-ready HTML files and assets
  publish = "apps/web/dist"

  # Serverless functions of the web app
  functions = "apps/web/netlify/functions"

# SPA redirect rule (also handled by public/_redirects, but good to have here too)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
